name: Shadow Acquisition Frame Proof

on:
  push:
    branches: [ feature/mvp-physical-proof ]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
      - name: Serve prototype
        run: |
          python3 -m http.server 8000 >/tmp/sis-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 0.2; done
          cat /tmp/sis-http.log; exit 1
      - name: Capture deterministic A/B frames
        run: |
          set -euo pipefail
          mkdir -p shadow-proof
          for variant in baseline acquisition; do
            if [ "$variant" = baseline ]; then reveal=3000; extra=''; else reveal=2550; extra='&acq=1'; fi
            for ms in 200 1200 1700 2500 3500; do
              out="shadow-proof/${variant}-t${ms}.png"
              "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=540,960 \
                --virtual-time-budget="$ms" --run-all-compositor-stages-before-draw --screenshot="$out" \
                "http://127.0.0.1:8000/?creative=1&level=0&revealAt=${reveal}${extra}" >/dev/null 2>&1
              test "$(stat -c%s "$out")" -gt 5000
            done
          done
      - name: Validate physical change
        run: |
          set -euo pipefail
          for variant in baseline acquisition; do
            cmp -s "shadow-proof/${variant}-t200.png" "shadow-proof/${variant}-t3500.png" && exit 1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-acquisition-frame-proof-${{ github.sha }}
          path: shadow-proof/*.png
          retention-days: 7
          if-no-files-found: error
