name: Cheap MVP Gate

on:
  push:
    branches: [ main, feature/mvp-physical-proof ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate.mjs
      - run: node scripts/deep_product_audit.mjs
