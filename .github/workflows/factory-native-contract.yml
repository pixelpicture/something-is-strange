name: Factory Native Contract V1
on:
  pull_request:
    branches: [main]
    paths:
      - 'factory-native/**'
      - 'factory/**'
      - 'scripts/validate_factory_native.mjs'
      - 'scripts/validate_cocos_playable.mjs'
      - 'scripts/validate_factory_v1.mjs'
      - '.github/workflows/factory-native-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate production-intent layered raster assets
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python factory-native/tools/generate_visual_assets.py
      - name: Validate Factory V1 contracts, playable scene and visual slice
        run: |
          node scripts/validate_factory_v1.mjs
          node scripts/validate_factory_native.mjs
          node scripts/validate_cocos_playable.mjs
      - name: Typecheck against Cocos Creator 3.8.8 API
        run: |
          npm install --prefix factory-native --no-save --no-audit --no-fund typescript@5.4.5 @cocos/creator-types@3.8.8
          ./factory-native/node_modules/.bin/tsc -p factory-native/tsconfig.json
      - name: Assert no rejected production coupling
        run: |
          ! grep -R "engine-v[234]" factory-native
          ! grep -R "WebView" factory-native/assets/scripts/domain factory-native/assets/scripts/cocos
          ! grep -R "document\.\|window\." factory-native/assets/scripts/domain
          test -f factory-native/package.json
          test -f factory-native/assets/ReferenceGame01.scene
          test -d factory-native/assets
          test -d factory-native/settings
          echo FACTORY_NATIVE_BOUNDARY_PASS
      - name: Package human-review evidence
        uses: actions/upload-artifact@v4
        with:
          name: factory-native-visual-evidence
          if-no-files-found: error
          retention-days: 7
          path: |
            evidence/native-visual-v1/*.png
            factory-native/assets/ReferenceGame01.scene
            factory-native/assets/ReferenceGame01.scene.meta
            factory-native/assets/resources/assets/**/*.png
            factory-native/assets/resources/scenes/*.scene.json

  creator-proof:
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Decide whether to run expensive Creator proof
        id: marker
        shell: pwsh
        run: |
          $msg = git log -1 --pretty=%B
          if ($msg -match '\[creator-proof\]') { 'run=true' >> $env:GITHUB_OUTPUT } else { 'run=false' >> $env:GITHUB_OUTPUT }
      - name: Restore Cocos Creator 3.8.8 cache
        if: steps.marker.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .ci/cocos-3.8.8
          key: cocos-3.8.8-win-010512-v2
      - name: Install official Cocos Creator 3.8.8
        if: steps.marker.outputs.run == 'true'
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE '.ci\cocos-3.8.8'
          $exe = Get-ChildItem -Path $root -Filter CocosCreator.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP 'CocosCreator-v3.8.8-win-010512.zip'
            $urls = @(
              'https://download.cocos.org/CocosCreator/v3.8.8/CocosCreator-v3.8.8-win-010512.zip',
              'https://download.cocos.com/CocosCreator/v3.8.8/CocosCreator-v3.8.8-win-010512.zip'
            )
            $downloaded = $false
            foreach ($url in $urls) {
              try {
                Write-Host "Trying official Creator package: $url"
                & curl.exe -fL --retry 2 --retry-delay 2 -A 'Mozilla/5.0 CocosCreator-CI/3.8.8' -e 'https://www.cocos.com/' -o $zip $url
                if ($LASTEXITCODE -eq 0 -and (Test-Path $zip) -and (Get-Item $zip).Length -gt 100MB) { $downloaded = $true; break }
              } catch { Write-Warning $_ }
              if (Test-Path $zip) { Remove-Item $zip -Force }
            }
            if (-not $downloaded) { throw 'Official Cocos Creator 3.8.8 package unavailable from both Cocos CDN endpoints' }
            Expand-Archive -Path $zip -DestinationPath $root -Force
          }
          $exe = Get-ChildItem -Path $root -Filter CocosCreator.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'CocosCreator.exe not found after extraction' }
          "COCOS_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Build real ByteDance mini-game with Creator 3.8.8
        if: steps.marker.outputs.run == 'true'
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'factory-native'
          $buildArgs = 'platform=bytedance-mini-game;debug=true;buildPath=project://build;startScene=53cbf133-47bb-4e38-99db-4d81319f9e57;name=SomethingIsStrange;logDest=project://creator-build.log'
          $p = Start-Process -FilePath $env:COCOS_EXE -ArgumentList @('--project', $project, '--build', $buildArgs, '--force') -Wait -PassThru
          Write-Host "Cocos exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 36) {
            if (Test-Path "$project\creator-build.log") { Get-Content "$project\creator-build.log" -Tail 300 }
            throw "Cocos Creator build failed with exit code $($p.ExitCode)"
          }
          $game = Get-ChildItem -Path "$project\build" -Filter game.json -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $game) {
            if (Test-Path "$project\creator-build.log") { Get-Content "$project\creator-build.log" -Tail 300 }
            throw 'ByteDance build completed without game.json'
          }
          Write-Host "BYTE_DANCE_BUILD_ROOT=$($game.Directory.FullName)"
      - name: Upload real Creator build evidence
        if: steps.marker.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: cocos-creator-3.8.8-bytedance-proof
          if-no-files-found: warn
          retention-days: 7
          path: |
            factory-native/build/**
            factory-native/creator-build.log
