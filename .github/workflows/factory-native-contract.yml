name: Factory Native Contract V1
on:
  pull_request:
    branches: [main]
    paths:
      - 'factory-native/**'
      - 'factory/**'
      - 'scripts/validate_factory_native.mjs'
      - 'scripts/validate_cocos_playable.mjs'
      - 'scripts/validate_factory_v1.mjs'
      - '.github/workflows/factory-native-contract.yml'
  workflow_dispatch:
    inputs:
      creator_proof:
        description: 'Run the expensive real Cocos Creator 3.8.8 ByteDance proof'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate production-intent layered raster assets
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python factory-native/tools/generate_visual_assets.py
      - name: Validate Factory V1 contracts, playable scene and visual slice
        run: |
          node scripts/validate_factory_v1.mjs
          node scripts/validate_factory_native.mjs
          node scripts/validate_cocos_playable.mjs
      - name: Typecheck against Cocos Creator 3.8.8 API
        run: |
          npm install --prefix factory-native --no-save --no-audit --no-fund typescript@5.4.5 @cocos/creator-types@3.8.8
          ./factory-native/node_modules/.bin/tsc -p factory-native/tsconfig.json
      - name: Assert no rejected production coupling
        run: |
          ! grep -R "engine-v[234]" factory-native
          ! grep -R "WebView" factory-native/assets/scripts/domain factory-native/assets/scripts/cocos
          ! grep -R "document\.\|window\." factory-native/assets/scripts/domain
          test -f factory-native/package.json
          test -f factory-native/assets/ReferenceGame01.scene
          echo FACTORY_NATIVE_BOUNDARY_PASS
      - name: Package human-review evidence
        uses: actions/upload-artifact@v4
        with:
          name: factory-native-visual-evidence
          if-no-files-found: error
          retention-days: 7
          path: |
            evidence/native-visual-v1/*.png
            factory-native/assets/ReferenceGame01.scene
            factory-native/assets/ReferenceGame01.scene.meta
            factory-native/assets/resources/assets/**/*.png
            factory-native/assets/resources/scenes/*.scene.json

  creator-proof:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.creator_proof == true }}
    needs: contract
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Restore Cocos Creator 3.8.8 cache
        uses: actions/cache@v4
        with:
          path: .ci/cocos-3.8.8
          key: cocos-3.8.8-mac-010512-v1
      - name: Install official Cocos Creator 3.8.8
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.ci/cocos-3.8.8"
          EXE=$(find "$ROOT" -path '*/CocosCreator.app/Contents/MacOS/CocosCreator' -type f 2>/dev/null | head -1 || true)
          if [ -z "$EXE" ]; then
            mkdir -p "$ROOT"
            ZIP="$RUNNER_TEMP/CocosCreator-v3.8.8-mac-010512.zip"
            URL='https://download.cocos.org/CocosCreator/v3.8.8/CocosCreator-v3.8.8-mac-010512.zip'
            curl -fL --retry 2 --retry-delay 2 -A 'Mozilla/5.0 CocosCreator-CI/3.8.8' -e 'https://www.cocos.com/' -o "$ZIP" "$URL"
            BYTES=$(stat -f%z "$ZIP")
            test "$BYTES" -gt 100000000
            ditto -x -k "$ZIP" "$ROOT"
          fi
          EXE=$(find "$ROOT" -path '*/CocosCreator.app/Contents/MacOS/CocosCreator' -type f | head -1)
          test -n "$EXE"
          xattr -dr com.apple.quarantine "$(dirname "$(dirname "$(dirname "$EXE")")")" || true
          chmod +x "$EXE"
          echo "COCOS_EXE=$EXE" >> "$GITHUB_ENV"
      - name: Build real ByteDance mini-game with Creator 3.8.8
        shell: bash
        run: |
          set +e
          PROJECT="$GITHUB_WORKSPACE/factory-native"
          ARGS='platform=bytedance-mini-game;debug=true;buildPath=project://build;startScene=53cbf133-47bb-4e38-99db-4d81319f9e57;name=SomethingIsStrange;logDest=project://creator-build.log'
          "$COCOS_EXE" --project "$PROJECT" --build "$ARGS" --force
          CODE=$?
          set -e
          echo "Cocos exit code: $CODE"
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 36 ]; then
            test -f "$PROJECT/creator-build.log" && tail -300 "$PROJECT/creator-build.log" || true
            exit "$CODE"
          fi
          GAME=$(find "$PROJECT/build" -name game.json -type f | head -1 || true)
          if [ -z "$GAME" ]; then
            test -f "$PROJECT/creator-build.log" && tail -300 "$PROJECT/creator-build.log" || true
            echo 'ByteDance build completed without game.json' >&2
            exit 1
          fi
          echo "BYTE_DANCE_BUILD_ROOT=$(dirname "$GAME")"
      - name: Upload real Creator build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocos-creator-3.8.8-bytedance-proof
          if-no-files-found: warn
          retention-days: 7
          path: |
            factory-native/build/**
            factory-native/creator-build.log
