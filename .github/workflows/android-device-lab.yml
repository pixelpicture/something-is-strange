name: Android Device Lab

on:
  push:
    branches: [ feature/mvp-physical-proof ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  physical-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable KVM acceleration
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Stage exact prototype into lab shell
        run: |
          set -euo pipefail
          mkdir -p android-device-lab/app/src/main/assets
          cp index.html styles.css levels.js engine-v2.js content-repairs.js creative-mode.js shadow-acquisition.js android-device-lab/app/src/main/assets/
      - name: Build lab APK
        working-directory: android-device-lab
        run: gradle --no-daemon assembleDebug
      - name: Run real Android emulator interactions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android_device_lab.sh
      - name: Validate device artifacts
        run: |
          set -euo pipefail
          test "$(find device-proof -name '*.png' | wc -l)" -eq 11
          test -s device-proof/shadow-device.mp4
          python3 - <<'PY'
          import glob, hashlib, struct
          files=sorted(glob.glob('device-proof/*.png'))
          assert len(files)==11
          hashes=[]
          for p in files:
              b=open(p,'rb').read()
              assert b[:8]==b'\x89PNG\r\n\x1a\n'
              w,h=struct.unpack('>II',b[16:24])
              assert w>=720 and h>=1280
              assert len(b)>30000, (p,len(b))
              hashes.append(hashlib.sha256(b).hexdigest())
          assert len(set(hashes))>=8
          for a,b in [('shadow-start.png','shadow-anomaly.png'),('shadow-wrongtap.png','shadow-correct.png'),('mirror-anomaly.png','mirror-correct.png'),('domino-anomaly.png','domino-correct.png'),('acq-before-turn.png','acq-after-turn.png')]:
              aa=open('device-proof/'+a,'rb').read(); bb=open('device-proof/'+b,'rb').read()
              assert hashlib.sha256(aa).digest()!=hashlib.sha256(bb).digest(),(a,b)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-lab-${{ github.sha }}
          path: device-proof/
          retention-days: 7
          if-no-files-found: error
