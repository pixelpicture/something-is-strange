name: Android Device Lab

on:
  push:
    branches: [ feature/mvp-physical-proof ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  physical-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Enable KVM acceleration
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
          else
            echo '/dev/kvm is unavailable on this runner'
            exit 1
          fi

      - name: Ensure free ffmpeg tooling
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Stage exact prototype into lab shell
        run: |
          set -euo pipefail
          mkdir -p android-device-lab/app/src/main/assets
          cp index.html styles.css levels.js engine-v2.js content-repairs.js creative-mode.js shadow-acquisition.js android-device-lab/app/src/main/assets/
          cp scripts/device_lab_probe.js android-device-lab/app/src/main/assets/device-lab-probe.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-device-lab/app/src/main/assets/index.html')
          s=p.read_text()
          marker='</body>'
          assert marker in s
          s=s.replace(marker, '  <script src="device-lab-probe.js"></script>\n</body>', 1)
          p.write_text(s)
          PY

      - name: Build lab APK
        working-directory: android-device-lab
        run: gradle --no-daemon assembleDebug

      - name: Run real Android emulator interactions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android_device_lab.sh

      - name: Validate device artifacts
        run: |
          set -euo pipefail
          test "$(find device-proof -name '*.png' | wc -l)" -eq 11
          test -s device-proof/shadow-device.mp4
          test "$(wc -c < device-proof/shadow-device.mp4)" -gt 100000
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 device-proof/shadow-device.mp4)" -eq 1080
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 device-proof/shadow-device.mp4)" -eq 2400
          python3 - <<'PY'
          import subprocess
          d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0','device-proof/shadow-device.mp4'], text=True).strip())
          assert 3.8 <= d <= 4.2, d
          PY
          ! grep -qiE 'Viewing full screen|Got it' device-proof/device-window.xml 2>/dev/null
          grep -q 'creative=1&acq=1' device-proof/device-log.txt
          test "$(grep -c '\[SIS_LAB\] EVENT HOTSPOT_CLICK' device-proof/device-log.txt)" -ge 5
          test "$(grep -c '\[SIS_LAB\] EVENT WRONG_TAP' device-proof/device-log.txt)" -ge 1
          test "$(grep -c '\[SIS_LAB\] EVENT NEXT_TAP' device-proof/device-log.txt)" -ge 3
          grep -q '\[SIS_LAB\] FEEDBACK NO' device-proof/device-log.txt
          grep -Eq '\[SIS_LAB\] (READY|SCENE|HOTSPOT) shadow_acquisition .*TIMER_DISPLAY none' device-proof/device-log.txt
          grep -Eq '\[SIS_LAB\] (READY|SCENE|HOTSPOT) mirror_desync ' device-proof/device-log.txt
          grep -Eq '\[SIS_LAB\] (READY|SCENE|HOTSPOT) domino_prediction ' device-proof/device-log.txt
          grep -Eq '\[SIS_LAB\] (READY|SCENE|HOTSPOT) wrong_light_switch ' device-proof/device-log.txt
          python3 - <<'PY'
          import glob, hashlib, struct
          files=sorted(glob.glob('device-proof/*.png'))
          assert len(files)==11, len(files)
          hashes=[]
          for p in files:
              b=open(p,'rb').read()
              assert len(b)>25000, (p,len(b))
              assert b[:8]==b'\x89PNG\r\n\x1a\n', p
              w,h=struct.unpack('>II',b[16:24])
              assert w>=720 and h>=1280, (p,w,h)
              hashes.append(hashlib.sha256(b).hexdigest())
          assert len(set(hashes)) >= 6, 'device proof is unexpectedly static'
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-lab-${{ github.sha }}
          path: device-proof/
          retention-days: 7
          if-no-files-found: error
