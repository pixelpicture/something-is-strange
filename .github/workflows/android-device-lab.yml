name: Android Device Lab

on:
  push:
    branches: [ feature/mvp-physical-proof ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  physical-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Stage exact prototype into lab shell
        run: |
          set -euo pipefail
          mkdir -p android-device-lab/app/src/main/assets
          cp index.html styles.css levels.js engine-v2.js content-repairs.js creative-mode.js shadow-acquisition.js android-device-lab/app/src/main/assets/

      - name: Build lab APK
        working-directory: android-device-lab
        run: gradle --no-daemon assembleDebug

      - name: Run real Android emulator interactions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            mkdir -p device-proof
            adb install -r android-device-lab/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.pixelpicture.sisdevicelab
            adb shell am start -W -n com.pixelpicture.sisdevicelab/.MainActivity --es url 'file:///android_asset/index.html?level=0'
            sleep 1
            adb exec-out screencap -p > device-proof/shadow-start.png
            sleep 1.2
            adb exec-out screencap -p > device-proof/shadow-anomaly.png
            adb shell input tap 120 1450
            sleep 0.4
            adb exec-out screencap -p > device-proof/shadow-wrongtap.png
            adb shell am force-stop com.pixelpicture.sisdevicelab
            adb shell am start -W -n com.pixelpicture.sisdevicelab/.MainActivity --es url 'file:///android_asset/index.html?level=0'
            sleep 2.2
            adb shell input tap 785 1290
            sleep 0.5
            adb exec-out screencap -p > device-proof/shadow-correct.png
            adb shell input tap 540 1780
            sleep 0.8
            adb exec-out screencap -p > device-proof/shadow-next.png
            adb shell am force-stop com.pixelpicture.sisdevicelab
            adb shell am start -W -n com.pixelpicture.sisdevicelab/.MainActivity --es url 'file:///android_asset/index.html?level=1'
            sleep 2.5
            adb exec-out screencap -p > device-proof/mirror-anomaly.png
            adb shell input tap 760 900
            sleep 0.5
            adb exec-out screencap -p > device-proof/mirror-correct.png
            adb shell am force-stop com.pixelpicture.sisdevicelab
            adb shell am start -W -n com.pixelpicture.sisdevicelab/.MainActivity --es url 'file:///android_asset/index.html?level=2'
            sleep 2.2
            adb exec-out screencap -p > device-proof/domino-anomaly.png
            adb shell input tap 620 1280
            sleep 0.5
            adb exec-out screencap -p > device-proof/domino-correct.png
            adb shell am force-stop com.pixelpicture.sisdevicelab
            adb shell am start -W -n com.pixelpicture.sisdevicelab/.MainActivity --es url 'file:///android_asset/index.html?creative=1&level=0&acq=1'
            adb shell 'screenrecord --time-limit 6 /sdcard/shadow-device.mp4 >/dev/null 2>&1 &'
            sleep 1.8
            adb exec-out screencap -p > device-proof/acq-before-turn.png
            sleep 1
            adb exec-out screencap -p > device-proof/acq-after-turn.png
            sleep 3.5
            adb pull /sdcard/shadow-device.mp4 device-proof/shadow-device.mp4
            adb logcat -d -s SIS_DEVICE_LAB:I '*:S' > device-proof/device-log.txt
            grep -q 'LOAD file:///android_asset/index.html' device-proof/device-log.txt

      - name: Validate device artifacts
        run: |
          set -euo pipefail
          test "$(find device-proof -name '*.png' | wc -l)" -eq 11
          test -s device-proof/shadow-device.mp4
          python3 - <<'PY'
          import glob, hashlib, struct
          files=sorted(glob.glob('device-proof/*.png'))
          assert len(files)==11, len(files)
          hashes=[]
          for p in files:
              b=open(p,'rb').read()
              assert b[:8]==b'\x89PNG\r\n\x1a\n', p
              w,h=struct.unpack('>II',b[16:24])
              assert w>=720 and h>=1280, (p,w,h)
              hashes.append(hashlib.sha256(b).hexdigest())
          assert len(set(hashes)) >= 8, 'device proof is unexpectedly static'
          pairs=[
            ('shadow-start.png','shadow-anomaly.png'),
            ('shadow-wrongtap.png','shadow-correct.png'),
            ('mirror-anomaly.png','mirror-correct.png'),
            ('domino-anomaly.png','domino-correct.png'),
            ('acq-before-turn.png','acq-after-turn.png'),
          ]
          for a,b in pairs:
              ba=open('device-proof/'+a,'rb').read(); bb=open('device-proof/'+b,'rb').read()
              assert hashlib.sha256(ba).digest()!=hashlib.sha256(bb).digest(), (a,b)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-lab-${{ github.sha }}
          path: device-proof/
          retention-days: 7
          if-no-files-found: error
